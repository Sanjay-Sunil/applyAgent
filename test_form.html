<!DOCTYPE html>
<html>
<head><title>Test Hackathon Application</title></head>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>Hackathon Application Form (Test)</h2>
    <form action="/submit" method="post">
        <label for="name">Full Name</label><br>
        <input type="text" id="name" name="name" style="width:300px;"><br><br>
        
        <label for="email">Email Address</label><br>
        <input type="email" id="email" name="email" style="width:300px;"><br><br>
        
        <label for="diet">Dietary Restrictions</label><br>
        <input type="text" id="diet" name="diet" style="width:300px;"><br><br>
        
        <label for="github">GitHub Profile URL</label><br>
        <input type="text" id="github" name="github" style="width:300px;"><br><br>
        
        <label for="essay">Why do you want to participate in this hackathon?</label><br>
        <textarea id="essay" name="essay" rows="5" style="width:500px;"></textarea><br><br>
        
        <label for="idea">Describe your project idea and tech stack:</label><br>
        <textarea id="idea" name="idea" rows="5" style="width:500px;"></textarea><br><br>
        
        <button type="submit">Submit Application</button>
    </form>
</body>
</html>
